.main-color {
	background-color: green;

html,

.cell-img, cell-img-off {

<html>

			<button id="loadButton" onClick="LoadCards()">Загрузить базу</button>
		</div>
		<div class="main-color" style="width:200px; padding:5px;">
			<div style="display:block">
				<p style="font-size:22px; padding:0px; margin:2px;" align="center">Добавить существо</p>
				<img id="card-img" class="cell-field" src="./goblin_avatar.png" class="avatar-img" style="position:relative;">

				<datalist id="colors">

					<option value="#008000">

<script type="text/javascript">
//localStorage.clear();
//localStorage.removeItem('tracker');
UpdateCreatureTable();
UpdateTrackTable();
function fileSelected(e)
{
	card_image = document.getElementById('card-img');
	path = './' + e.files[0].name;
	card_image.setAttribute('src', path);
}

function createCard()
{
	var card_image = document.getElementById('card-img');
	var path = card_image.getAttribute('src');
	var name_input = document.getElementById('creature-name');
	var name = name_input.value;
	var color_input = document.getElementById('select-color');
	var color = color_input.value;
	
	
	id = GetStorageLastId('cards')+1;
	item = {"name":name, "path":path, 'color':color, 'id':id}
	localStorageAdd(item);
	//CreatureCellAdd(item);
	UpdateCreatureTable();
	
	ClearNameField();
}

async function SaveCards()
{
	var handle = await window.showSaveFilePicker();
	const writable = await handle.createWritable();
	await writable.write('Text example');
	await writable.close();
	
}

async function LoadCards()
{
	var [handle] = await window.showOpenFilePicker({defaultDirectory: "../"});
	var file = await handle.getFile();
	var content = await file.text();
	alert(content);
}

function localStorageAdd(items)
{
	console.log(localStorage.length);
	if (localStorage.length != 0)
	{
		const storage = localStorage.getItem('cards');
		const content = JSON.parse(storage);		
		content.push(items);
		items = content;
		console.log(items);
	}
	else
	{
		items = [items]
	}
	
	const newStorage = JSON.stringify(items);
	localStorage.setItem('cards', newStorage)
}

function LogStorage()
{
	const storage = localStorage.getItem('cards');
	const content = JSON.parse(storage);
	for (var i = 0; i < content.length; i++) {
		console.log(content[i].name);
	}
}

function CreatureCellAdd(creature)
{
	var cell = document.createElement('td');
	cell.className="cell";
	cell.innerHTML = 
	`<img id="avatar-img-1" src="`+creature.path+`" class="avatar-img" style="position:static;">		
	<div style="background-color:gray; padding:5px;">
		<div id="cell-name" class="cell-field main-color" style="background-color:`+creature.color+`">
			<small>`+creature.name+`</small>
		</div>
		<div id="cell-name" class="cell-field main-color">
			<button id="" onClick="TrackCreature(`+creature.id+`)">В бой!</button>
		</div>		
		
		<div id="cell-name" class="cell-field main-color">
			<button id="" onClick="DeleteCreatureCell(`+creature.id+`)">Удалить</button>
		</div>	
	</div>`;
	creatures.append(cell);
}

function GetStorageLastId(table)
{
	const storage = localStorage.getItem(table);
	const parsedContent = JSON.parse(storage);
	
	if (parsedContent == null || parsedContent.length == 0)
		return 0;
	else
		return (parsedContent[parsedContent.length-1].id);
}

function DeleteCreatureCell(id)
{
	const storage = localStorage.getItem('cards');
	const parsedContent = JSON.parse(storage);
	var notFound = true;
	for (var i=0; i < parsedContent.length; i++)
	{
		if (parsedContent[i].id == id)
			parsedContent.splice(i, 1);
			notFound = false;
	}
	
	if (notFound)
		console.log("creature id not found");
	
	const newStorage = JSON.stringify(parsedContent);
	localStorage.setItem('cards', newStorage);
	
	console.log(parsedContent);
	UpdateCreatureTable();
}

function UpdateCreatureTable()
{
	const storage = localStorage.getItem('cards');
	var creatures = JSON.parse(storage);
	
	const row = document.getElementById("creatures");
	const table = document.getElementById("creatures-table");
	
	const input = document.getElementById("filter-input");
	const filter = input.value;
	
	row.remove();
	
	var newRow = document.createElement('tr');
	newRow.id="creatures";
	creatures-table.append(newRow);
	
	creatures = creatures.filter(str1 => str1.name.indexOf(filter) !== -1);
	creatures = creatures.sort((a, b) => a.name.localeCompare(b.name));
	
	for (var i=0; i < creatures.length; i++)
	{
		creature = creatures[i];
		CreatureCellAdd(creature);
	}
}

function TrackCreature(id_creature)
{
	//search creature and make track-item
	const storage = localStorage.getItem('cards');
	const track_storage = localStorage.getItem('tracker');
	var creatures = JSON.parse(storage);
	var creature = null;
	var track_item = null;
	
	not_found = true;
	for (var i=0; i < creatures.length;i++)
		if (creatures[i].id == id_creature)
		{
			creature = creatures[i];
			not_found = false;
		}
	
	if (not_found)
		console.log("cant track creature with id: "+ id_creature+ "; id not found");
	
	//getting last id for specify delete func
	var id = GetStorageLastId('tracker') + 1;
	effects = {'conc':-1, 'debuff':-1, 'power':-1, 'buff':-1};
	track_item = {'id':id, 'creature':creature, 'effects':effects, 'initiative':0};
	
	//create cell
	AddTrackCell(track_item)
	
	
	var items = null;

	
	if (track_storage == null)
		items = [track_item];
	else
	{
		var parsedTrack= JSON.parse(track_storage);
		parsedTrack.push(track_item);
		items = parsedTrack;
	}
		
	items = JSON.stringify(items);
	localStorage.setItem('tracker', items);
	
	console.log(items);
}

function AddTrackCell(track_item)
{
	var creature = track_item.creature;
	var cell = document.createElement('td');
	cell.class="cell";
	cell.innerHTML = `
	<div id="cell-1" class="cell cell-box-inactive" onMouseenter="showEffects('show-conc`+track_item.id+`', 'show-power`+track_item.id+`', 'show-debuff`+track_item.id+`', 'show-buff`+track_item.id+`', false)" onMouseleave="showEffects('show-conc`+track_item.id+`', 'show-power`+track_item.id+`', 'show-debuff`+track_item.id+`', 'show-buff`+track_item.id+`', true)">
			<div style="position:relative">
				<div id="show-conc`+track_item.id+`" style="position:absolute; left:0px; bottom:0px; display:`+(track_item.effects.conc<0?'none':'block')+`">
					<img src="./concentrate_.png" width="30px">
					<input id="concetrate-input`+track_item.id+`" type="number" style="width:40px; font-size:25px; border:0px; background-color:`+creature.color+`" value="`+track_item.effects.conc+`" onChange="changeEffect('concetrate-input`+track_item.id+`', `+track_item.id+`, 'conc')">
				</div>
				
				<div>
					<img id="avatar-img-1" src="`+creature.path+`" class="avatar-img">
				</div>
			
				<div style="position:absolute; right:0px; bottom:0px;">
					<div id="show-debuff`+track_item.id+`" style="display:`+(track_item.effects.debuff<0?'none':'block')+`">
						<img src="./debuff_.png" width="30px">
						<input id="debuff-input`+track_item.id+`" type="number" style="width:40px; font-size:25px; border:0px; background-color:`+creature.color+`;" value="`+track_item.effects.debuff+`" onChange="changeEffect('debuff-input`+track_item.id+`', `+track_item.id+`, 'debuff')";>
					</div>
					
					<div id="show-power`+track_item.id+`" style="display:`+(track_item.effects.power<0?'none':'block')+`">
						<img src="./power_.png" width="30px">
						<input id="power-input`+track_item.id+`" type="number" style="width:40px; font-size:25px; border:0px; background-color:`+creature.color+`;" value="`+track_item.effects.power+`" onChange="changeEffect('power-input`+track_item.id+`', `+track_item.id+`, 'power')";>
					</div>
					
					<div id="show-buff`+track_item.id+`" style="display:`+(track_item.effects.buff<0?'none':'block')+`">
						<img src="./buff_.png" width="30px">
						<input id="buff-input`+track_item.id+`" type="number" style="width:40px; font-size:25px; border:0px; background-color:`+creature.color+`;" value="`+track_item.effects.buff+`" onChange="changeEffect('buff-input`+track_item.id+`', `+track_item.id+`, 'buff')">
					</div>
				</div>
			</div>
			<div style="padding:5px;" align="center">
				<div id="cell-name`+track_item.id+`" class="cell-field" style="background-color:`+creature.color+`">
					<small>`+creature.name+`</small>
				</div>
				<div id="cell-initiative`+track_item.id+`" class="cell-field" style="background-color:`+creature.color+`" >
					<input id="track_`+track_item.id+`" type="text" style="width:98%; background-color:inherit; border:none; font-size:25px; text-align:center;" value="`+track_item.initiative+`" onChange="SetInitiative(`+track_item.id+`)" value="`+track_item.initiative+`"></input>
				</div>
				<div id="cell-delete`+track_item.id+`" class="cell-field" style="background-color:`+creature.color+`">
					<input type="color" id="select-color`+track_item.id+`" class="cell-field" list="colors" value="`+creature.color+`" onChange="changeColor(['cell-name`+track_item.id+`', 'cell-initiative`+track_item.id+`', 'cell-delete`+track_item.id+`', 'power-input`+track_item.id+`', 'debuff-input`+track_item.id+`', 'buff-input`+track_item.id+`', 'concetrate-input`+track_item.id+`'], 'select-color`+track_item.id+`', `+track_item.id+`)"></input>
					<datalist id="colors">
					<option value="#ff0000">
					<option value="#008000">
					<option value="#808080">
					<option value="#ffff00">
					<option value="#8b00ff">
					<option value="#42aaff">
					<option value="#ffffff">
				</datalist>
					<button onClick="DeleteTrack(`+track_item.id+`)">Удалить</button>
				</div>
				
			</div>
		</div>`;
	
	//append to row
	const tracker = document.getElementById("tracker-row");
	tracker.append(cell);
}

function DeleteTrack(id_track)
{
	const track_storage = localStorage.getItem('tracker');
	var track = JSON.parse(track_storage);
	
	for (var i=0; i < track.length; i++)
	{
		if (track[i].id == id_track)
			track.splice(i, 1);
	}
		
	const str_ = JSON.stringify(track);
	localStorage.setItem('tracker', str_);

	UpdateTrackTable();
}

function UpdateTrackTable()
{
	//delete, create
	const tracker_table = document.getElementById("tracker-table");
	var tracker_row = document.getElementById("tracker-row");
	
	tracker_row.remove();
	tracker_row = document.createElement('tr');
	tracker_row.id = "tracker-row";
	tracker_table.append(tracker_row);
	
	//get and sort creatures by initiative
	const storage = localStorage.getItem('tracker');
	var trackers = JSON.parse(storage);
	
	trackers = trackers.sort((a, b) => a.initiative - b.initiative);
	
	//append cells
	
	for (var i=0; i < trackers.length; i++)
	{
		console.log(trackers[i]);
		AddTrackCell(trackers[i]);
	}
}

function NumericField(e)
{

}
function ClearNameField()
{
	const name = document.getElementById("creature-name");
	name.value = "";
}

function SetInitiative(id_track)
{
	var value = document.getElementById("track_"+id_track).value
	var storage = localStorage.getItem('tracker');
	storage = JSON.parse(storage);
	
	for(var i=0; i < storage.length; i++)
	{
		if (storage[i].id == id_track)
		{
			storage[i].initiative = value;
			console.log(storage[i]);
			break;
		}	
	}
	
	storage = JSON.stringify(storage);
	localStorage.setItem('tracker', storage);
}

function showEffects(concentration_id, power_id, debuff_id, buff_id, value)
{
	const conc_el = document.getElementById(concentration_id);
	const power_el = document.getElementById(power_id);
	const debuff_el = document.getElementById(debuff_id);
	const buff_el = document.getElementById(buff_id);
	
	//check every input
	if (value)
	{
		// getting value of input: console.log(conc_el.childNodes[3].value);
		if (conc_el.childNodes[3].value < 0)
			conc_el.style.display = 'none';
		if (power_el.childNodes[3].value < 0)
			power_el.style.display = 'none';
		if (debuff_el.childNodes[3].value < 0)
			debuff_el.style.display = 'none';
		if (buff_el.childNodes[3].value < 0)
			buff_el.style.display = 'none';
	}
	else
	{
		conc_el.style.display = 'block';
		power_el.style.display = 'block';
		debuff_el.style.display = 'block';
		buff_el.style.display = 'block';
	}	
}

function changeColor(fields, color_field_id, track_id)
{
	var color_field_el = document.getElementById(color_field_id);
	var color = color_field_el.value;
	
	for (var j = 0; j < fields.length; j++)
	{
		var field_el = document.getElementById(fields[j]);
		field_el.style.backgroundColor = color;
	}
	
	var storage = JSON.parse(localStorage.getItem('tracker'));
	for (var i = 0; i < storage.length; i++)
	{
		if (storage[i].id==track_id)
		{
			storage[i].creature.color = color;
			localStorage.setItem('tracker', JSON.stringify(storage));
			break;
		}
	}
	
	
}

function changeEffect(effect_id, track_item_id, effect_type)
{
	
	const effect_value = document.getElementById(effect_id).value;
	var storage = JSON.parse(localStorage.getItem('tracker'));
	for (var i = 0; i < storage.length; i++)
	{
		if (storage[i].id == track_item_id)
		{
			storage[i].effects[effect_type] = effect_value;
		}
	}
	
	localStorage.setItem('tracker', JSON.stringify(storage));
}
</script>
