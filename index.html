<!DOCTYPE html>

<style type="text/css">
.main-color {
	background-color: green;

html, 
body {

.cell-img, cell-img-off {

	max-width:160px;
	margin-top:5px;

.cell {
	position:relative;
	align:center;
}

.tracker-cell-block {
	display:inline-block;
}

<html>

						<img src="./debuff.png" width="30px">

					<div>

					</div>

				<img id="card-img" class="cell-field" src="./goblin_avatar.png" class="avatar-img" style="position:relative;">

						<div style="background-color:gray; padding:5px;">

								<small>Гоблин</small>

<script type="text/javascript">
//localStorage.clear();
localStorage.removeItem('tracker');
UpdateCreatureTable();
//UpdateTrackTable();
function fileSelected(e)
{
	card_image = document.getElementById('card-img');
	path = './' + e.files[0].name;
	card_image.setAttribute('src', path);
}

function createCard()
{
	var card_image = document.getElementById('card-img');
	var path = card_image.getAttribute('src');
	var name_input = document.getElementById('creature-name');
	var name = name_input.value;
	var color_input = document.getElementById('select-color');
	var color = color_input.value;
	
	
	id = GetStorageLastId('cards')+1;
	item = {"name":name, "path":path, 'color':color, 'id':id}
	localStorageAdd(item);
	//CreatureCellAdd(item);
	UpdateCreatureTable();
	
	ClearNameField();
}

async function SaveCards()
{
	var handle = await window.showSaveFilePicker();
	const writable = await handle.createWritable();
	await writable.write('Text example');
	await writable.close();
	
}

async function LoadCards()
{
	var [handle] = await window.showOpenFilePicker({defaultDirectory: "../"});
	var file = await handle.getFile();
	var content = await file.text();
	alert(content);
}

function localStorageAdd(items)
{
	console.log(localStorage.length);
	if (localStorage.length != 0)
	{
		const storage = localStorage.getItem('cards');
		const content = JSON.parse(storage);		
		content.push(items);
		items = content;
		console.log(items);
	}
	else
	{
		items = [items]
	}
	
	const newStorage = JSON.stringify(items);
	localStorage.setItem('cards', newStorage)
}

function LogStorage()
{
	const storage = localStorage.getItem('cards');
	const content = JSON.parse(storage);
	for (var i = 0; i < content.length; i++) {
		console.log(content[i].name);
	}
}

function CreatureCellAdd(creature)
{
	var cell = document.createElement('td');
	cell.className="cell";
	cell.innerHTML = 
	`<img id="avatar-img-1" src="`+creature.path+`" class="avatar-img" style="position:static;">		
	<div style="background-color:gray; padding:5px;">
		<div id="cell-name" class="cell-field main-color" style="background-color:`+creature.color+`">
			<small>`+creature.name+`</small>
		</div>
		<div id="cell-name" class="cell-field main-color">
			<button id="" onClick="TrackCreature(`+creature.id+`)">В бой!</button>
		</div>		
		
		<div id="cell-name" class="cell-field main-color">
			<button id="" onClick="DeleteCreatureCell(`+creature.id+`)">Удалить</button>
		</div>	
	</div>`;
	creatures.append(cell);
}

function GetStorageLastId(table)
{
	const storage = localStorage.getItem(table);
	const parsedContent = JSON.parse(storage);
	
	if (parsedContent == null || parsedContent.length == 0)
		return 0;
	else
		return (parsedContent[parsedContent.length-1].id);
}

function DeleteCreatureCell(id)
{
	const storage = localStorage.getItem('cards');
	const parsedContent = JSON.parse(storage);
	var notFound = true;
	for (var i=0; i < parsedContent.length; i++)
	{
		if (parsedContent[i].id == id)
			parsedContent.splice(i, 1);
			notFound = false;
	}
	
	if (notFound)
		console.log("creature id not found");
	
	const newStorage = JSON.stringify(parsedContent);
	localStorage.setItem('cards', newStorage);
	
	console.log(parsedContent);
	UpdateCreatureTable();
}

function UpdateCreatureTable()
{
	const storage = localStorage.getItem('cards');
	var creatures = JSON.parse(storage);
	
	const row = document.getElementById("creatures");
	const table = document.getElementById("creatures-table");
	
	const input = document.getElementById("filter-input");
	const filter = input.value;
	
	row.remove();
	
	var newRow = document.createElement('tr');
	newRow.id="creatures";
	creatures-table.append(newRow);
	
	creatures = creatures.filter(str1 => str1.name.indexOf(filter) !== -1);
	creatures = creatures.sort((a, b) => a.name.localeCompare(b.name));
	
	for (var i=0; i < creatures.length; i++)
	{
		creature = creatures[i];
		CreatureCellAdd(creature);
	}
}

function TrackCreature(id_creature)
{
	//search creature and make track-item
	const storage = localStorage.getItem('cards');
	const track_storage = localStorage.getItem('tracker');
	var creatures = JSON.parse(storage);
	var creature = null;
	var track_item = null;
	
	not_found = true;
	for (var i=0; i < creatures.length;i++)
		if (creatures[i].id == id_creature)
		{
			creature = creatures[i];
			not_found = false;
		}
	
	if (not_found)
		console.log("cant track creature with id: "+ id_creature+ "; id not found");
	
	//getting last id for specify delete func
	var id = GetStorageLastId('tracker') + 1;
	track_item = {'id':id, 'creature':creature, 'initiative':0};
	
	//create cell
	AddTrackCell(track_item)
	
	
	var items = null;

	
	if (track_storage == null)
		items = [track_item];
	else
	{
		var parsedTrack= JSON.parse(track_storage);
		parsedTrack.push(track_item);
		items = parsedTrack;
	}
		
	items = JSON.stringify(items);
	localStorage.setItem('tracker', items);
	
	console.log(items);
}

function AddTrackCell(track_item)
{
	var creature = track_item.creature;
	var cell = document.createElement('td');
	cell.class="cell";
	cell.innerHTML = `
	<div class="cell-box">
				<div class="cell-img" style="visibility:hidden; position:static;">
				</div>
				<img id="avatar-img-1" src="`+creature.path+`" class="avatar-img">
				<img id="turn-img-1" src="./turn_avatar.png" class="cell-img-off">
			</div>
			
			<div style="background-color:gray; padding:5px;">
				<div id="cell-name" class="cell-field main-color" style="background-color:`+creature.color+`">
					<small>`+creature.name+`</small>
				</div>
				<div id="cell-name" class="cell-field main-color" style="background-color:`+creature.color+`">
					<input id="track_`+track_item.id+`" type="text" onChange="SetInitiative(`+track_item.id+`)" style="width:100%; background-color:inherit; border:none; font-size:25px; text-align:center;" value="`+track_item.initiative+`"></input>
				</div>
				<div id="cell-name" class="cell-field main-color" style="background-color:`+creature.color+`">
					<button onClick="DeleteTrack(`+track_item.id+`)">Удалить</button>
				</div>
			</div>`;
	
	//append to row
	const tracker = document.getElementById("tracker-row");
	tracker.append(cell);
}

function DeleteTrack(id_track)
{
	const track_storage = localStorage.getItem('tracker');
	var track = JSON.parse(track_storage);
	
	for (var i=0; i < track.length; i++)
	{
		if (track[i].id == id_track)
			track.splice(i, 1);
	}
		
	const str_ = JSON.stringify(track);
	localStorage.setItem('tracker', str_);

	UpdateTrackTable();
}

function UpdateTrackTable()
{
	//delete, create
	const tracker_table = document.getElementById("tracker-table");
	var tracker_row = document.getElementById("tracker-row");
	
	tracker_row.remove();
	tracker_row = document.createElement('tr');
	tracker_row.id = "tracker-row";
	tracker_table.append(tracker_row);
	
	//get and sort creatures by initiative
	const storage = localStorage.getItem('tracker');
	var trackers = JSON.parse(storage);
	
	trackers = trackers.sort((a, b) => a.initiative - b.initiative);
	
	//append cells
	
	for (var i=0; i < trackers.length; i++)
	{
		console.log(trackers[i]);
		AddTrackCell(trackers[i]);
	}
}

{

}
function ClearNameField()
{
	const name = document.getElementById("creature-name");
	name.value = "";
}

function SetInitiative(id_track)
{
	var value = document.getElementById("track_"+id_track).value
	var storage = localStorage.getItem('tracker');
	storage = JSON.parse(storage);
	
	for(var i=0; i < storage.length; i++)
	{
		if (storage[i].id == id_track)
		{
			storage[i].initiative = value;
			console.log(storage[i]);
			break;
		}	
	}
	
	storage = JSON.stringify(storage);
	localStorage.setItem('tracker', storage);
}
</script>
