<!DOCTYPE html>

<style type="text/css">
.main-color {
	background-color: green;
	}
.secondary-color {
	background-color: orange;
	}

html, 
body {
    height: 100%;
}

.cell-img {
	align:center;
	position:absolute;
	width: 160px;
	height: 160px;
	top: 0px;
	left: 0px;
}

.avatar-img {
	align:center;
	width: 130px;
	height: 130px;
	position:absolute;
	top: 15px;
	left: 15px;
}

.cell-box {
	position:relative;
}

.cell-field {
	text-align:center;
	font-size:25px;
	max-width:160px;
	margin-top:5px;
}

.cell {
	position:relative;

}
</style>

<html>	
<body style="margin:0; padding:0; border:0;">
	<header class="main-color" style="height:120px">
		<p align="center" 
		style="margin:inherit; padding:inherit; padding-top:40px; font-size:35px; font-weight: bold;">
		Трекер инициативы</p>
	</header>
	
	<div class="secondary-color" style="overflow-x:auto; overflow-y:hidden; margin:10px">
		<table align="center" style="margin:5px; margin-left:auto; margin-right:auto; ">
			<td id="cell-1" class="cell">
			<div class="cell-box">
				<div class="cell-img" style="visibility:hidden; position:static;">
				</div>
				<img id="avatar-img-1" src="./goblin_avatar.png" class="avatar-img">
				<img id="turn-img-1" src="./turn_avatar.png" class="cell-img">
			</div>
			
			<div style="background-color:gray; padding:5px;">
				<div id="cell-name" class="cell-field main-color">
					<small>Гоблин</small>
				</div>
				<div id="cell-name" class="cell-field main-color">
					<small>Инициатива: 20</small>
				</div>
			</div>
			</td>

		</table>
	</div>
	
	<div style="margin:10px; background-color:gray; display:flex; flex-direction:row; max-width:100%">
		<div>
			<button id="saveButton" onClick="SaveCards()">Сохранить базу</button>
			<button id="loadButton" onClick="LoadCards()">Загрузить базу</button>
		</div>
		<div class="main-color" style="width:200px; padding:5px;">
			<div style="display:block">
				<p style="font-size:22px; padding:0px; margin:2px;" align="center">Добавить существо</p>
				<img id="card-img" class="cell-field" src="./goblin_avatar.png" class="avatar-img" style="position:relative;">
				<input type="file" id="load-img" class="cell-field" onChange="fileSelected(this)">Загрузить изображение</button>
				<input type="text" id="initiative-input" class="cell-field" placeholder ="Имя существа"></input>
				<button id="create_card" class="cell-field" onClick="createCard()">Создать карточку</button>
			</div>
		</div>
		
		<div class="main-color" style="margin-left:5px; padding:5px; overflow-x:auto; overflow-y:hidden;">
			<p style="font-size:22px; padding:0px; margin:2px" align="center">Готовые существа</p>
				<table>
				<tr id="creatures">
					<td class="cell" align="center">
						<img id="avatar-img-1" src="./goblin_avatar.png" class="avatar-img" style="position:static">
								
						<div style="background-color:gray; padding:5px;">
							<div id="cell-name" class="cell-field main-color">
								<small>Гоблин</small>
							</div>
							<div id="cell-name" class="cell-field main-color">
								<button id="" onClick="LogStorage()">Добавить на таймлайн</button>
							</div>		
						</div>	
					</td>
				</tr>	
				</table>
		</div>
	</div>
</body>
</html>

<script type="text/javascript">
localStorage.clear();
function fileSelected(e)
{
	card_image = document.getElementById('card-img');
	path = './' + e.files[0].name;
	card_image.setAttribute('src', path);
}

function createCard()
{
	var card_image = document.getElementById('card-img');
	var path = card_image.getAttribute('src');
	var name_input = document.getElementById('initiative-input');
	var name = name_input.value;
	
	item = {"name":name, "path":path}
	localStorageAdd(item);
	CreatureCellAdd(item);
	//UpdateCreatureTable();
}

async function SaveCards()
{
	var handle = await window.showSaveFilePicker();
	const writable = await handle.createWritable();
	await writable.write('Text example');
	await writable.close();
	
}

async function LoadCards()
{
	var [handle] = await window.showOpenFilePicker({defaultDirectory: "../"});
	var file = await handle.getFile();
	var content = await file.text();
	alert(content);
}

function localStorageAdd(items)
{
	console.log(localStorage.length);
	if (localStorage.length != 0)
	{
		const storage = localStorage.getItem('cards');
		const content = JSON.parse(storage);		
		content.push(items);
		items = content;
		console.log(items);
	}
	else
	{
		items = [items]
	}
	
	const newStorage = JSON.stringify(items);
	localStorage.setItem('cards', newStorage)
}

function LogStorage()
{
	const storage = localStorage.getItem('cards');
	const content = JSON.parse(storage);
	for (var i = 0; i < content.length; i++) {
		console.log(content[i].name);
	}
}

function CreatureCellAdd(creature)
{
	var cell = document.createElement('td');
	//div.className="";
	cell.innerHTML = 
	`<img id="avatar-img-1" src="`+creature.path+`" class="avatar-img" style="position:static">		
	<div style="background-color:gray; padding:5px;">
		<div id="cell-name" class="cell-field main-color">
			<small>`+creature.name+`</small>
		</div>
		<div id="cell-name" class="cell-field main-color">
			<button id="" onClick="LogStorage()">Добавить на таймлайн</button>
		</div>		
	</div>`;
	creatures.append(cell);
}

function DeleteCreatureCell(id)
{
	const storage = localStorage.getItem('cards');
	var content = JSON.parse(storage);
	content = content.splice(id, 1);
	
	const newStorage = JSON.stringify(content);
	localStorage.setItem('cards', newStorage)
}

{
	
}
</script>
